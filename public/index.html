<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Loopkiste</title>
<meta name="theme-color" content="#14111d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="play" class="play" aria-label="Start/Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M7 4.5v15l12-7.5z"/><path class="i-stop" d="M6 6h12v12H6z"/></svg></button>
    <div class="topmid">
      <div class="brand">Loopkiste</div>
      <div class="meta">
        <button id="bpmBtn" class="chip mono" aria-label="Tempo">120 BPM</button>
        <button id="keyBtn" class="chip" aria-label="Tonart">D Dorisch</button>
      </div>
    </div>
    <button id="menuBtn" class="iconbtn" aria-label="Projekt und Export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <nav class="scenes" aria-label="Szenen">
    <div class="scenelist" id="scenes"></div>
    <button id="sceneCopy" class="chip ghost" title="Aktuelle Szene in die nächste freie kopieren">+ Kopie</button>
    <button id="barsBtn" class="chip ghost mono" title="Länge der Szene">1 Takt</button>
    <button id="undoBtn" class="chip ghost" title="Rückgängig">↶</button>
  </nav>

  <nav class="tracks" id="tracks" aria-label="Spuren"></nav>

  <main class="editor" id="editor">
    <div class="edhead" id="edhead"></div>
    <div class="edbody" id="edbody"></div>
  </main>

  <footer class="perf" aria-label="Halte-Effekte">
    <button class="fx" data-fx="filter"><b>Filter</b><span>halten · wischen</span></button>
    <button class="fx" data-fx="stutter"><b>Stotter</b><span>halten</span></button>
    <button class="fx" data-fx="echo"><b>Echo</b><span>halten</span></button>
    <button class="fx" data-fx="tape"><b>Bandstopp</b><span>halten</span></button>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetbg" data-close></div>
  <section class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheethead"><h2 id="sheetTitle">Klang</h2><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="sheetbody" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="boot" id="boot"><div class="bootbox"><div class="brand big">Loopkiste</div><p>Drums, Bass, Akkorde, Lead. Mit DollyDrumz, PuSS-30, Sonique 4x20 und Pierrette.</p><button id="bootBtn" class="cta">Loslegen</button><p class="small">Ton startet nach dem Tippen.</p></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
